name: Find guide photos (Pexels)
# Searches Pexels with the PEXELS_API_KEY repository secret and publishes candidate
# photos + provenance to branch photos/<slug>. Nothing reaches the site until a person
# picks one and runs scripts/visuals/import-photo.py (see .agents/skills/saipan-guide-photos).
on:
  workflow_dispatch:
    inputs:
      slug: {description: 'Guide slug, e.g. pgt-a', required: true}
      queries: {description: 'English search terms separated by ;', required: true}
      per_query: {description: 'Candidates per query', default: '6'}
      orientation: {description: 'landscape | portrait | square', default: 'landscape'}
  push:
    paths: ['photo-requests/*.json']
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: python3 -m pip install --quiet pillow
      - name: Collect requests
        id: req
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 - <<'PY' > requests.txt
          import json
          print(json.dumps({"slug": "${{ inputs.slug }}", "queries": [q.strip() for q in """${{ inputs.queries }}""".split(';') if q.strip()], "perQuery": int("${{ inputs.per_query }}"), "orientation": "${{ inputs.orientation }}"}))
          PY
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'photo-requests/*.json' | while read f; do python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1]))))" "$f"; done > requests.txt
          fi
          cat requests.txt
      - name: Search and download candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -eu
          if [ -z "${PEXELS_API_KEY}" ]; then echo "::error::PEXELS_API_KEY repository secret is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          while read -r line; do
            [ -z "$line" ] && continue
            args=$(python3 -c "import json,sys,shlex;r=json.loads(sys.argv[1]);print(' '.join(['--slug',shlex.quote(r['slug'])]+[x for q in r['queries'] for x in ('--query',shlex.quote(q))]+['--per-query',str(r.get('perQuery',6)),'--orientation',r.get('orientation','landscape')]))" "$line")
            eval python3 scripts/visuals/pexels.py $args --out photo-candidates
          done < requests.txt
      - name: Publish candidates to photos/<slug>
        run: |
          set -eu
          for dir in photo-candidates/*/; do
            slug=$(basename "$dir"); tmp=$(mktemp -d)
            cp -r "$dir" "$tmp/$slug"
            printf 'Candidates for %s from %s (commit %s). Review contact-sheet.jpg, open each Pexels page, then import with scripts/visuals/import-photo.py.\n' "$slug" "${{ github.ref_name }}" "${{ github.sha }}" > "$tmp/$slug/README.txt"
            cd "$tmp"; git init -q; git checkout -q -b "photos/$slug"
            git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Photo candidates for $slug"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "photos/$slug"
            cd - >/dev/null
            echo "### photos/$slug published" >> "$GITHUB_STEP_SUMMARY"
          done

name: Site verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install font subset tooling
        run: python -m pip install fonttools brotli
      - name: Build and refresh checked-in font subsets
        run: |
          npm run build
          npm run fonts:fetch
          python scripts/subset-fonts.py
      - name: Verify committed font subsets are current
        run: git diff --exit-code -- public/fonts
      - name: Build and run full checks
        run: npm run verify

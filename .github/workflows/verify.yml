name: Site verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install font subset tooling
        run: python -m pip install fonttools brotli
      - name: Build and refresh checked-in font subsets
        run: |
          npm run build
          npm run fonts:fetch
          python scripts/subset-fonts.py
      - name: Commit refreshed font subsets to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- public/fonts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/fonts
            git commit -m "build(fonts): refresh multilingual heading subsets"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Build and run full checks
        run: npm run verify

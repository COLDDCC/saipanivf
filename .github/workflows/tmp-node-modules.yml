name: tmp node_modules snapshot
on:
  push:
    branches: [tmp/node-modules-snapshot]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          tar czf /tmp/nm.tgz node_modules
          ls -la /tmp/nm.tgz
          mkdir /tmp/out && cd /tmp/out && split -b 40m -d /tmp/nm.tgz nm.tgz.part-
          sha256sum /tmp/nm.tgz > nm.tgz.sha256
          git init -q && git checkout -q -b tmp/node-modules-data
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "node_modules snapshot (temporary)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp/node-modules-data

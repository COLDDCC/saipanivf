name: Guide visual review
on:
  pull_request:
    paths:
      - 'src/components/SaipanCitizenshipGuide.astro'
      - 'src/pages/**/saipan-baby-us-citizenship.astro'
      - '.github/workflows/guide-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p guide-review-images
          python3 -m http.server 4321 --directory dist > /tmp/preview.log 2>&1 &
          sleep 2
          for locale in en zh-hant; do
            npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="1440,900" --full-page "http://127.0.0.1:4321/$locale/guides/saipan-baby-us-citizenship/" "guide-review-images/${locale}-desktop.png"
            npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="390,844" --full-page "http://127.0.0.1:4321/$locale/guides/saipan-baby-us-citizenship/" "guide-review-images/${locale}-mobile.png"
          done
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="1440,900" --full-page "http://127.0.0.1:4321/guides/saipan-baby-us-citizenship/" "guide-review-images/zh-cn-desktop.png"
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="390,844" --full-page "http://127.0.0.1:4321/guides/saipan-baby-us-citizenship/" "guide-review-images/zh-cn-mobile.png"
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="1440,900" --full-page "http://127.0.0.1:4321/guides/egg-freezing-cost/" "guide-review-images/golden-desktop.png"
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size="390,844" --full-page "http://127.0.0.1:4321/guides/egg-freezing-cost/" "guide-review-images/golden-mobile.png"
      - uses: actions/upload-artifact@v4
        with:
          name: guide-visual-review
          path: guide-review-images/

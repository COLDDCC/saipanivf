name: Prepare licensed newborn cover
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download credited Pexels photograph and optimize
        run: |
          test ! -e public/images/stock/saipan-citizenship-cover.webp || exit 0
          curl -fL --retry 3 --max-time 40 'https://images.pexels.com/photos/14937147/pexels-photo-14937147.jpeg?auto=compress&cs=tinysrgb&w=960' -o /tmp/newborn.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/newborn.jpg').convert('RGB')
          im.thumbnail((960,960))
          im.save('public/images/stock/saipan-citizenship-cover.webp','WEBP',quality=81,method=6)
          print(im.size)
          PY
      - name: Commit cover to PR branch
        run: |
          git add public/images/stock/saipan-citizenship-cover.webp
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "asset: add separate licensed newborn cover from Pexels"
          git push origin HEAD:${{ github.head_ref }}

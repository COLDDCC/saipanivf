name: Deploy Saipan IVF to Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Select available deployment method
        id: method
        shell: bash
        run: |
          if [ -n "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo "method=hook" >> "$GITHUB_OUTPUT"
          elif { [ -n "$CLOUDFLARE_API_TOKEN" ] || [ -n "$CF_API_TOKEN" ]; } && { [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || [ -n "$CF_ACCOUNT_ID" ]; }; then
            echo "method=wrangler" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cloudflare deploy hook or API token/account ID not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Trigger Cloudflare Git deployment
        if: steps.method.outputs.method == 'hook'
        run: curl --fail --silent --show-error --max-time 30 -X POST "$CF_PAGES_DEPLOY_HOOK"
      - uses: actions/setup-node@v4
        if: steps.method.outputs.method == 'wrangler'
        with:
          node-version: '22'
          cache: npm
      - name: Build static site
        if: steps.method.outputs.method == 'wrangler'
        run: npm ci && npm run verify
      - name: Upload production release
        if: steps.method.outputs.method == 'wrangler'
        shell: bash
        run: |
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$CF_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-$CF_ACCOUNT_ID}"
          npx --yes wrangler@4 pages deploy dist --project-name saipanivf --branch main

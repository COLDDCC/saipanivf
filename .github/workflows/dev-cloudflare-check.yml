name: Check existing Cloudflare dev preview
on:
  push:
    branches: [dev]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify dev branch preview on Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://dev.saipanivf.pages.dev/en/guides/saipan-baby-us-citizenship/" "https://saipanivf.pages.dev/en/guides/saipan-baby-us-citizenship/"; do
            status=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" --max-time 20 "$url" || true)
            echo "$url HTTP $status"
            if [ "$status" = "200" ] && grep -q 'saipan-citizenship-cover.webp' /tmp/page.html; then echo "PASS: $url"; else echo "NOT AVAILABLE: $url"; fi
          done

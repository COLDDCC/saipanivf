name: Production guide smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirm all three live guide routes and SEO metadata
        shell: bash
        run: |
          set -euo pipefail
          base="https://saipanivf.pages.dev"
          slug="guides/saipan-baby-us-citizenship/"
          for locale in en/ "" zh-hant/; do
            url="$base/$locale$slug"
            ok=0
            for attempt in $(seq 1 25); do
              if curl --fail --location --silent --show-error --max-time 15 "$url" > /tmp/guide.html && grep -q 'Saipan IVF' /tmp/guide.html && grep -q 'saipan-citizenship-cover.webp' /tmp/guide.html && grep -q 'rel="canonical"' /tmp/guide.html; then
                echo "PASS live $url (attempt $attempt)"
                ok=1
                break
              fi
              echo "Not deployed yet ($attempt): $url"
              sleep 10
            done
            test "$ok" = 1 || { echo "FAIL live $url"; exit 1; }
          done
          curl --fail --location --silent --show-error --max-time 15 "$base/sitemap.xml" | grep -q 'saipan-baby-us-citizenship'
          echo "PASS live sitemap"
